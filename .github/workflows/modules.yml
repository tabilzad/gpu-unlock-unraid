name: Modules

# Builds gpu_unlock.ko for Unraid kernels and publishes each build as a GitHub
# release named after the kernel (6.18.58-Unraid, ...), which is where the
# plugin's gpu-unlock-ctl fetches it from. Once a day the discover job takes
# the kernels in kernels.txt plus every kernel ich777 has published a prepared
# tree for that is newer than the newest one released here, and builds (at
# most a few per night) those that have no module of the pinned
# MODULE_VERSION yet. A new Unraid release therefore gets its module without
# anyone touching this repository. Manual runs can name kernels and force a
# rebuild.
#
# Only GPL code is built here; no NVIDIA file is ever downloaded or published.

on:
  schedule:
    - cron: '41 5 * * *'
  workflow_dispatch:
    inputs:
      kernels:
        description: 'Kernels to build, comma-separated (e.g. 6.18.58-Unraid). Empty: every published kernel without a module yet.'
        required: false
        default: ''
      force:
        description: 'Rebuild even if the release already carries the module'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: modules
  cancel-in-progress: false

jobs:
  discover:
    name: kernels to build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      kernels: ${{ steps.list.outputs.kernels }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: List kernels
        id: list
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_KERNELS: ${{ github.event.inputs.kernels }}
          INPUT_FORCE: ${{ github.event.inputs.force }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mv=$(sed -n 's/^MODULE_VERSION=//p' versions.env)
          min=$(sed -n 's/^MIN_KERNEL=//p' versions.env)
          max_new=6
          kver_re='^[0-9]+\.[0-9]+\.[0-9]+-Unraid$'
          # ge A B: version A is B or newer
          ge() { [ "$(printf '%s\n%s\n' "$2" "$1" | sort -V | head -n1)" = "$2" ]; }
          if [ -n "$INPUT_KERNELS" ]; then
            list=$(printf '%s' "$INPUT_KERNELS" | tr ',' '\n' | tr -d ' ' | grep -E "$kver_re" || true)
          else
            # The kernels in kernels.txt, plus every published kernel newer than
            # the newest one that has a release here (or than the newest listed).
            listed=$(sed 's/#.*//' kernels.txt | tr -d ' \t' | grep -E "$kver_re" || true)
            published=$(gh release list -R ich777/unraid_kernel --limit 300 --json tagName -q '.[].tagName' |
              grep -E "$kver_re" | sort -V)
            ours=$(gh release list -R "$REPO" --limit 300 --json tagName -q '.[].tagName' | grep -E "$kver_re" || true)
            top=$(printf '%s\n%s\n' "$ours" "$listed" | grep -v '^$' | sort -V | tail -n1)
            newer=$(printf '%s\n' "$published" | while read -r k; do
              [ -n "$k" ] || continue
              ge "$k" "$min-Unraid" || continue
              if [ "$k" = "$top" ] || ! ge "$k" "$top"; then continue; fi
              printf '%s\n' "$ours" | grep -qx "$k" || echo "$k"
            done)
            list=$(printf '%s\n%s\n' "$listed" "$newer" | grep -v '^$' | sort -uV)
          fi
          if [ "$INPUT_FORCE" != true ]; then
            list=$(printf '%s\n' "$list" | while read -r k; do
              [ -n "$k" ] || continue
              if gh release view "$k" -R "$REPO" --json assets -q '.assets[].name' 2> /dev/null | grep -qx "gpu_unlock-$mv-$k.ko"; then
                echo "::notice::$k already has gpu_unlock-$mv-$k.ko" >&2
                continue
              fi
              echo "$k"
            done)
          fi
          if [ -z "$INPUT_KERNELS" ]; then
            # A bounded amount of work per night; the rest follows on later nights.
            list=$(printf '%s\n' "$list" | grep -v '^$' | sort -V | tail -n "$max_new")
          fi
          json=$(printf '%s\n' "$list" | grep -v '^$' | jq -R . | jq -s -c .)
          echo "kernels to build: $json"
          echo "kernels=$json" >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.kver }}
    needs: discover
    if: needs.discover.outputs.kernels != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        kver: ${{ fromJSON(needs.discover.outputs.kernels) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build the module
        env:
          KVER: ${{ matrix.kver }}
        run: ./scripts/build-module --kver "$KVER" --out dist/modules

      - name: Publish to the kernel's release
        env:
          GH_TOKEN: ${{ github.token }}
          KVER: ${{ matrix.kver }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mv=$(sed -n 's/^MODULE_VERSION=//p' versions.env)
          ref=$(sed -n 's/^UPSTREAM_REF=//p' versions.env)
          if ! gh release view "$KVER" -R "$REPO" > /dev/null 2>&1; then
            notes="gpu_unlock kernel module built for Unraid kernel \`$KVER\` from [Zagitta/gpu-unlock](https://github.com/Zagitta/gpu-unlock) at \`$ref\` (GPL-2.0-only), against the prepared tree from [ich777/unraid_kernel](https://github.com/ich777/unraid_kernel/releases/tag/$KVER).

          The GPU Unlock plugin fetches \`gpu_unlock-<version>-$KVER.ko\` from here by itself. No NVIDIA file is published; the firmware is generated on your server."
            gh release create "$KVER" -R "$REPO" --target "$GITHUB_SHA" --latest=false \
              --title "Unraid kernel $KVER" --notes "$notes"
          fi
          gh release upload "$KVER" -R "$REPO" --clobber \
            "dist/modules/gpu_unlock-$mv-$KVER.ko" \
            "dist/modules/gpu_unlock-$mv-$KVER.ko.sha256" \
            "dist/modules/gpu_unlock-$mv-$KVER.manifest.txt"
          cat "dist/modules/gpu_unlock-$mv-$KVER.manifest.txt"
